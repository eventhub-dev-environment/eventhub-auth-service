server:
  port: 8082

spring:
  application:
    name: auth-service
  profiles:
    active: dev

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971 # Clave secreta en Base64/Hex (min 256 bits)
  expiration-ms: 86400000 # 24 Horas

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: "b3,w3c"
    export:
      zipkin:
        endpoint: ${MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT:http://zipkin:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"